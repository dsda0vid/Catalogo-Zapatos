<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo de zapatos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#151a17; --surface:#1e2521; --surface-2:#151a17; --line:#2c352f;
  --text:#e9eee9; --muted:#86938a; --accent:#a9bfa6; --accent-ink:#17211a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{padding:56px 0 28px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(3rem,10vw,6.5rem);line-height:.9;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:14px 0 0;max-width:46ch}
.pay{display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pay img{height:30px;width:auto;border-radius:6px}
.pay span{color:var(--muted);font-size:.95rem}
.pay strong{font-family:var(--display);font-size:1.5rem;letter-spacing:.04em}
.pay button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:600}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-block:1px solid var(--line);padding:14px 0}
.bar .wrap{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}
.field{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.field::placeholder{color:var(--muted)}
.meta{display:flex;justify-content:space-between;align-items:center;padding:18px 0 8px;color:var(--muted);font-size:.95rem}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding:10px 0 72px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0;text-align:left;cursor:pointer;overflow:hidden;display:flex;flex-direction:column}
.card:hover{border-color:var(--accent)}
.pic{background:var(--surface-2);padding:22px 18px 10px}
.pic svg{width:100%;height:auto;display:block}
.pic img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:6px}
.car{position:relative}
.car>div{width:100%}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:99px;border:1px solid rgba(233,238,233,.18);background:rgba(21,26,23,.72);color:var(--text);cursor:pointer;display:grid;place-items:center;padding:0;transition:background .15s,color .15s,border-color .15s}
.nav:hover{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.nav-prev{left:10px}
.nav-next{right:10px}
.cnt{position:absolute;bottom:10px;right:14px;font-size:.8rem;color:var(--muted);background:var(--bg);border-radius:99px;padding:1px 9px}
.info{padding:14px 16px 18px}
.brand{color:var(--muted);font-size:.9rem}
.name{font-family:var(--display);font-weight:700;font-size:1.55rem;line-height:1.1;margin:2px 0 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-weight:600}
.tag{font-size:.82rem;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 10px}
.empty{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--muted)}
dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:0;width:min(760px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(5,7,10,.75)}
.dlg{display:grid;grid-template-columns:1fr 1fr}
.dlg .pic{display:flex;align-items:center;padding:24px}
.dlg .body{padding:26px 24px 24px}
.dlg h2{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;margin:2px 0 10px}
.dlg p{color:var(--muted);margin:0 0 16px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0 0 18px}
dt{color:var(--muted)} dd{margin:0}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.sizes span{border:1px solid var(--line);border-radius:6px;padding:2px 9px;font-size:.9rem}
.close{position:absolute;top:10px;right:10px;background:var(--bg);border:1px solid var(--line);border-radius:99px;width:36px;height:36px;cursor:pointer}
dialog{position:fixed}
@media (max-width:760px){
  .bar .wrap{grid-template-columns:1fr 1fr}
  .bar .wrap .field:first-child{grid-column:1/-1}
  .dlg{grid-template-columns:1fr}
  dialog{overflow:auto}
}
@media (prefers-reduced-motion:no-preference){
  .card{transition:border-color .15s,transform .15s}
  .card:hover{transform:translateY(-3px)}
}
</style>
</head>
<body>
<header class="wrap">
  <h1>Catálogo<br>de zapatos</h1>
  <p class="sub">Toda la colección en un solo lugar. Busca por nombre o filtra por marca, categoría y talla.</p>
  <div class="pay">
    <img id="nequiLogo" alt="Nequi" hidden>
    <span>Paga por Nequi</span>
    <strong id="nequi"></strong>
    <button type="button" id="copy">Copiar número</button>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <input class="field" id="q" type="search" placeholder="Buscar por nombre" aria-label="Buscar por nombre">
    <select class="field" id="brand" aria-label="Marca"></select>
    <select class="field" id="cat" aria-label="Categoría"></select>
    <select class="field" id="size" aria-label="Talla"></select>
  </div>
</div>

<main class="wrap">
  <div class="meta"><span id="count"></span><button class="link" id="clear" type="button">Limpiar filtros</button></div>
  <div class="grid" id="grid"></div>
</main>

<dialog id="dlg" aria-labelledby="dName"></dialog>
<script>
/* Tu número de Nequi (cámbialo por el tuyo) */
const NEQUI = "310 271 1175";

/* Logo de Nequi: pega aquí la URL o la ruta del archivo, por ejemplo "logo-nequi.png".
   Si lo dejas vacío (""), el logo no se muestra. */
const NEQUI_LOGO = "https://play-lh.googleusercontent.com/ieznb73N7P1gm49TTOYpQX23BAUlRVxiVnzy2_YJQSAkcfOkKOi9U-UQlvW5vCt1Exf2ljI-rn4Hc81xddqg5M8=s0-br30";

/* ===== Edita aquí tus zapatos =====
   img: URL directa de la foto (termina en .jpg, .png o .webp).
   Si lo dejas vacío ("") se muestra la silueta de color.
   fotos: lista de URLs auxiliares, por ejemplo ["url1","url2"].
   Aparecen en la ventana de detalles con flechas (la foto principal va primero). */
const SHOES = [
  {id:1,img:"https://i.pinimg.com/736x/2d/8b/9b/2d8b9b2af920b4fb52460a5b47461c28.jpg",fotos:["https://i.pinimg.com/736x/38/6e/c1/386ec11488da3c4064ed4f1653738705.jpg"],name:"Under Armour UA Lockdown 7",brand:"Under Armour",cat:"Sport",price:399000,sizes:[41],color:"#3dd6c6",colorName:"Rojo y negro",material:"Malla transpirable y Cuero",desc:"Parte superior de malla transpirable con revestimientos de cuero y película para una mayor sujeción y durabilidad."},
  {id:2,img:"https://i.pinimg.com/736x/2b/67/55/2b6755df7a9c7bb6c6a0d4ae91bf7bf8.jpg",fotos:["https://i.pinimg.com/736x/06/30/20/06302083e9d4ea3ecdacc27ad484b6f7.jpg"],name:"Adidas Ultrarun 5",brand:"Adidas",cat:"Sport",price:399000,sizes:[38,39],color:"#f2f2f0",colorName:"Hueso",material:"Malla transpirable",desc:" El exterior de malla mantiene tus pies frescos y cómodos de principio a fin."},
  {id:3,img:"https://i.pinimg.com/736x/70/50/74/7050743ba2f87ca3e06e90b95547c0c2.jpg",fotos:["https://i.pinimg.com/736x/e8/be/ea/e8beea2cc5bf4ed8f4db05744021e301.jpg"],name:"Tommy Hilfigier Mujer Lawson",brand:"Tommy Hilfiger",cat:"Casual",price:399000,sizes:[36,37],color:"#8a6a4a",colorName:"Blanco",material:"Cuero y suela de goma",desc:"Resistente con buen agarre para caminatas y terrenos irregulares."},
  {id:4,img:"https://i.pinimg.com/736x/db/a2/41/dba24174626d9ea5990e4a76b6000968.jpg",fotos:["https://i.pinimg.com/736x/08/f8/73/08f873384a4266b01a8e7be1a52f2a7d.jpg"],name:"Puma Adelina 2",brand:"Puma",cat:"Casual",price:319000,sizes:[37,38],color:"#2b2b30",colorName:"Negro",material:"Tela",desc:" Plantilla cómoda, diseñada con un talón extra grueso para proporcionar una amortiguación suave."},
  {id:5,img:"https://i.pinimg.com/736x/e3/5c/30/e35c30c34c8a6176531076ac7b6c0ede.jpg",fotos:["https://i.pinimg.com/736x/89/f4/f7/89f4f74adb6c3b4467a97cae5d813d03.jpg"],name:"Puma Twitch Runner Mujer",brand:"Puma",cat:"Sport",price:349000,sizes:[37,38],color:"#ff7a45",colorName:"Negro y rosado",material:"Malla y espuma ligera",desc:"Respuesta rápida y mucha comodidad para ritmos exigentes."},
  {id:6,img:"https://i.pinimg.com/736x/96/73/ad/9673adeb86c069402cb9282bcc350005.jpg",fotos:["https://i.pinimg.com/736x/33/ea/df/33eadf03f958774181db7d6b679ce4d2.jpg"],name:"Nike Precision 7",brand:"Nike",cat:"Sport",price:499000,sizes:[38],color:"#4a7bd6",colorName:"Azul",material:"Negro y blanco",desc:"Diseñados con una combinación de control del suelo, comodidad y tracción."},
  {id:7,img:"https://i.pinimg.com/736x/94/5b/f5/945bf504bfca26bbde48d5c49a27380a.jpg",fotos:["https://i.pinimg.com/736x/ad/90/1e/ad901ef681aa70f8a3527ba216a71442.jpg"],name:"Under Armour UA Lockdown 7",brand:"Under Armour",cat:"Sport",price:399000,sizes:[43],color:"#6b3f2a",colorName:"Negro y dorado",material:"Malla transpirable y Cuero",desc:"Parte superior de malla transpirable con revestimientos de cuero y película para una mayor sujeción y durabilidad."},
  {id:8,img:"https://i.pinimg.com/736x/a2/9a/d4/a29ad42b5422885bf97a2eba0e60cedb.jpg",fotos:[],name:"Nautica kappil",brand:"Nautica",cat:"Sport",price:319000,sizes:[38],color:"#556b4a",colorName:"Morado y blanco",material:"Malla",desc:"La tela de malla ligera promueve el flujo de aire y mantiene los pies frescos al caminar, entrenar o el uso diario."},
  {id:9,img:"https://i.pinimg.com/736x/69/77/25/697725fa36dd09569f3c18ffb505af82.jpg",fotos:["https://i.pinimg.com/736x/d7/4c/96/d74c96c7ee3211d62568eefefef8e9d0.jpg"],name:"Adidas Response Pace",brand:"Adidas",cat:"Sport",price:319000,sizes:[35],color:"#556b4a",colorName:"Blanco",material:"Malla transpirable",desc:"Tenis con amortiguación en la mediasuela de Cloudfoam para brindar mayor comodidad y soporte."},
  {id:10,img:"https://i.pinimg.com/736x/82/01/ff/8201ffbcc511b539f28965d2f5f5a338.jpg",fotos:["https://i.pinimg.com/736x/4c/de/2a/4cde2ac08c474680c56200821030fac7.jpg"],name:"Vans Brooklyn LS",brand:"Vans",cat:"Casual",price:319000,sizes:[40],color:"#556b4a",colorName:"Negro y blanco",material:"Cuero",desc:"Tenis de estilo urbano inspirados en el skate y el BMX, diseñados para el uso diario."}
];
/* =================================== */

const $ = id => document.getElementById(id);
const money = new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0});

function shoeSVG(color){
  return `<svg viewBox="0 0 200 110" role="img" aria-hidden="true">
    <path d="M10 76h182v6q0 12-14 12H24q-14 0-14-12z" fill="#e9ecf2"/>
    <path d="M14 76V58q0-8 10-10l28-6q12-2 20-14l12-14q6-6 14 0l10 12q12 14 38 20 34 6 44 20 4 6 2 10z" fill="${color}"/>
    <path d="M70 40l14 8M82 30l14 8M94 24l14 10" stroke="rgba(0,0,0,.35)" stroke-width="3" stroke-linecap="round"/>
    <path d="M30 66q50 4 150 4" stroke="rgba(255,255,255,.55)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>`;
}

function pic(s){
  return s.img
    ? `<img src="${s.img}" alt="${s.name}" loading="lazy" referrerpolicy="no-referrer" data-color="${s.color}">`
    : shoeSVG(s.color);
}

function imgTag(url,s){
  return `<img src="${url}" alt="${s.name}" loading="lazy" referrerpolicy="no-referrer" data-color="${s.color}">`;
}

function fillSelect(el, label, values){
  el.innerHTML = `<option value="">${label}</option>` + values.map(v=>`<option value="${v}">${v}</option>`).join("");
}
const uniq = a => [...new Set(a)].sort((x,y)=>String(x).localeCompare(String(y),"es",{numeric:true}));
fillSelect($("brand"),"Todas las marcas",uniq(SHOES.map(s=>s.brand)));
fillSelect($("cat"),"Todas las categorías",uniq(SHOES.map(s=>s.cat)));
fillSelect($("size"),"Todas las tallas",uniq(SHOES.flatMap(s=>s.sizes)));

function render(){
  const q = $("q").value.trim().toLowerCase();
  const b = $("brand").value, c = $("cat").value, z = $("size").value;
  const list = SHOES.filter(s =>
    (!q || s.name.toLowerCase().includes(q)) &&
    (!b || s.brand===b) && (!c || s.cat===c) && (!z || s.sizes.includes(Number(z))));
  $("count").textContent = list.length===1 ? "1 zapato" : list.length+" zapatos";
  $("grid").innerHTML = list.length ? list.map(s=>`
    <button class="card" type="button" data-id="${s.id}" aria-label="Ver detalles de ${s.name}">
      <div class="pic">${pic(s)}</div>
      <div class="info">
        <div class="brand">${s.brand}</div>
        <div class="name">${s.name}</div>
        <div class="row"><span class="price">${money.format(s.price)}</span><span class="tag">${s.cat}</span></div>
      </div>
    </button>`).join("")
    : `<div class="empty">No hay zapatos con esos filtros. Prueba con otra búsqueda o limpia los filtros.</div>`;
}

function openShoe(id){
  const s = SHOES.find(x=>x.id===id); if(!s) return;
  const imgs = [s.img, ...(s.fotos||[])].filter(Boolean);
  $("dlg").innerHTML = `
    <button class="close" type="button" aria-label="Cerrar" id="x">✕</button>
    <div class="dlg">
      <div class="pic car">
        <div id="slide"></div>
        ${imgs.length>1 ? `<button class="nav nav-prev" id="prev" type="button" aria-label="Foto anterior"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><button class="nav nav-next" id="next" type="button" aria-label="Foto siguiente"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button><span class="cnt" id="cnt"></span>` : ""}
      </div>
      <div class="body">
        <div class="brand">${s.brand}</div>
        <h2 id="dName">${s.name}</h2>
        <p>${s.desc}</p>
        <dl>
          <dt>Precio</dt><dd>${money.format(s.price)}</dd>
          <dt>Categoría</dt><dd>${s.cat}</dd>
          <dt>Color</dt><dd>${s.colorName}</dd>
          <dt>Material</dt><dd>${s.material}</dd>
        </dl>
        <div class="brand" style="margin-bottom:6px">Tallas disponibles</div>
        <div class="sizes">${s.sizes.map(t=>`<span>${t}</span>`).join("")}</div>
      </div>
    </div>`;
  $("dlg").showModal();
  $("x").onclick = () => $("dlg").close();
  let i = 0;
  const show = () => {
    $("slide").innerHTML = imgs.length ? imgTag(imgs[i],s) : shoeSVG(s.color);
    if($("cnt")) $("cnt").textContent = (i+1)+" / "+imgs.length;
  };
  if(imgs.length>1){
    $("prev").onclick = () => { i = (i-1+imgs.length)%imgs.length; show(); };
    $("next").onclick = () => { i = (i+1)%imgs.length; show(); };
  }
  $("dlg").onkeydown = e => {
    if(e.key==="ArrowLeft" && $("prev")) $("prev").click();
    if(e.key==="ArrowRight" && $("next")) $("next").click();
  };
  show();
}

["q","brand","cat","size"].forEach(id => $(id).addEventListener("input",render));
$("clear").onclick = () => { $("q").value=""; ["brand","cat","size"].forEach(i=>$(i).value=""); render(); };
$("grid").addEventListener("click", e => { const c = e.target.closest(".card"); if(c) openShoe(Number(c.dataset.id)); });
$("dlg").addEventListener("click", e => { if(e.target===$("dlg")) $("dlg").close(); });
/* Si una foto no carga, se muestra la silueta de color */
document.addEventListener("error", e => {
  const t = e.target;
  if(t.tagName==="IMG" && t.dataset.color) t.outerHTML = shoeSVG(t.dataset.color);
}, true);

/* Número de Nequi */
$("nequi").textContent = NEQUI;
if(NEQUI_LOGO){
  const logo = $("nequiLogo");
  logo.onerror = () => { logo.hidden = true; };
  logo.src = NEQUI_LOGO;
  logo.hidden = false;
}
$("copy").onclick = async () => {
  const b = $("copy");
  try { await navigator.clipboard.writeText(NEQUI.replace(/\s/g,"")); b.textContent = "¡Copiado!"; }
  catch { b.textContent = "Cópialo manualmente"; }
  setTimeout(() => b.textContent = "Copiar número", 1800);
};

render();
</script>
</body>
</html>
